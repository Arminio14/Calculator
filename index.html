<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
    <link rel="stylesheet" href="calculator.css">
    <link rel="icon" type="image/png" href="calculator.png">
</head>
<body>
<div id="BothBoxes">
    <div id="Background">
        <input type="text" id="calculatorInput">
        <input type="button" id="ergebnisAnzeige">
        <div>
            <button class="left" id="btn7">7</button>
            <button class="gray" id="btn8">8</button>
            <button class="gray" id="btn9">9</button>
            <button class="blue" id="multiplication">*</button>
        </div>
        <div>
            <button class="left" id="btn4">4</button>
            <button class="gray" id="btn5">5</button>
            <button class="gray" id="btn6">6</button>
            <button class="blue" id="addition">+</button>
        </div>
        <div>
            <button class="left" id="btn1">1</button>
            <button class="gray" id="btn2">2</button>
            <button class="gray" id="btn3">3</button>
            <button class="blue" id="division">/</button>
        </div>
        <div>
            <button class="left" id="btn0">0</button>
            <button class="gray" id="btn(">(</button>
            <button class="gray" id="btn)">)</button>
            <button class="blue" id="subtraktion">-</button>
        </div>
        <div>
            <button class="left" id="btnπ">π</button>
            <button class="blue" id="btn²">²</button>
            <button class="blue" id="btnroot">√</button>
            <button class="blue" id="power">^</button>
        </div>
        <div>
            <button class="left" id="btnsin">sin(</button>
            <button class="blue" id="btncos">cos(</button>
            <button class="blue" id="btntan">tan(</button>
            <button class="blue" id="btnRound2">round2</button>
        </div>
        <div>
            <button class="left" id="btnasin">asin(</button>
            <button class="blue" id="btnacos">acos(</button>
            <button class="blue" id="btnatan">atan(</button>
            <button class="blue" id="btnRound">round</button>
        </div>
        <div>
            <button class="left" id="btnpunkt">.</button>
            <button class="red" id="equal">=</button>
            <button class="red" id="erease">C</button>
            <button class="red"  id="back">←</button>
        </div>
    </div>
    <div id="ergebnisSammlung">
        <h3>Verlauf</h3>
        <div id="history"></div>
        <button id="clearHistory">Clear History</button>
    </div>
</div>    


<script src="calculator.js"></script>
</body>
</html>
